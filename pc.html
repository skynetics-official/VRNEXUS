<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR NEXUS - Каталог игр для ПК</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'], display: ['Nunito', 'sans-serif'] },
                    colors: { vr: { dark: '#232738', card: '#2e3350', accent1: '#9be3d3', accent2: '#c3b1f5' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col antialiased" data-src="pc.json" data-plat="pc">

    <header class="glass sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex flex-col xl:flex-row xl:justify-between items-center gap-3 xl:gap-4">
            <div class="flex flex-col sm:flex-row items-center gap-3 sm:gap-6 w-full xl:w-auto min-w-0 sm:justify-between xl:justify-start">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-vr-cardboard text-3xl text-vr-accent1"></i>
                <h1 class="font-display text-2xl font-extrabold tracking-wide">VR<span class="text-vr-accent2">NEXUS</span></h1>
            </div>
            <nav class="flex gap-1 bg-vr-dark/60 rounded-full p-1 max-w-full overflow-x-auto no-scrollbar sm:overflow-visible sm:shrink-0"><a href="index.html" class="shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-300 hover:bg-white/10"><i class="fa-solid fa-vr-cardboard mr-1 sm:mr-1.5"></i>VR</a><a href="pc.html" class="shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition bg-vr-accent2 text-vr-dark"><i class="fa-solid fa-desktop mr-1 sm:mr-1.5"></i>ПК</a><a href="ps5.html" class="shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-300 hover:bg-white/10"><i class="fa-brands fa-playstation mr-1 sm:mr-1.5"></i>PS5</a><a href="xbox.html" class="shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-300 hover:bg-white/10"><svg class="svg-ico mr-1 sm:mr-1.5" viewBox="0 0 512 512" aria-hidden="true"><path d="M369.9 318.2c44.3 54.3 64.7 98.8 54.4 118.7-7.9 15.1-56.7 44.6-92.6 55.9-29.6 9.3-68.4 13.3-100.4 10.2-38.2-3.7-76.9-17.4-110.1-39C93.3 445.8 87 438.3 87 423.4c0-29.9 32.9-82.3 89.2-142.1 32-33.9 76.5-73.7 81.4-72.6 9.4 2.1 84.3 75.1 112.3 109.5zM188.6 143.8c-29.7-26.9-58.1-53.9-86.4-63.4-15.2-5.1-16.3-4.8-28.7 8.1-29.2 30.4-53.5 79.7-60.3 122.4-5.4 34.2-6.1 43.8-4.2 60.5 5.6 50.5 17.3 85.4 40.5 120.9 9.5 14.6 12.1 17.3 9.3 9.9-4.2-11-.3-37.5 9.5-64 14.3-39 53.9-112.9 120.3-194.4zm311.6 63.5C483.3 127.3 432.7 77 425.6 77c-7.3 0-24.2 6.5-36 13.9-23.3 14.5-41 31.4-64.3 52.8C367.7 197 427.5 283.1 448.2 346c6.8 20.7 9.7 41.1 7.4 52.3-1.7 8.5-1.7 8.5 1.4 4.6 6.1-7.7 19.9-31.3 25.4-43.5 7.4-16.2 15-40.2 18.6-58.7 4.3-22.5 3.9-70.8-.8-93.4zM141.3 43C189 40.5 251 77.5 255.6 78.4c.7.1 10.4-4.2 21.6-9.7 63.9-31.1 94-25.8 107.4-25.2-63.9-39.3-152.7-50-233.9-11.7-23.4 11.1-24 11.9-9.4 11.2z"/></svg>Xbox</a><a href="switch.html" class="shrink-0 px-2.5 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold transition text-gray-300 hover:bg-white/10"><svg class="svg-ico mr-1 sm:mr-1.5" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.176 24h3.674c3.376 0 6.15-2.774 6.15-6.15V6.15C24 2.775 21.226 0 17.85 0H14.1c-.074 0-.15.074-.15.15v23.7c-.001.076.075.15.226.15zm4.574-13.199c1.351 0 2.399 1.125 2.399 2.398 0 1.352-1.125 2.4-2.399 2.4-1.35 0-2.4-1.049-2.4-2.4-.075-1.349 1.05-2.398 2.4-2.398zM11.4 0H6.15C2.775 0 0 2.775 0 6.15v11.7C0 21.226 2.775 24 6.15 24h5.25c.074 0 .15-.074.15-.149V.15c.001-.076-.075-.15-.15-.15zM9.676 22.051H6.15c-2.326 0-4.201-1.875-4.201-4.201V6.15c0-2.326 1.875-4.201 4.201-4.201H9.6l.076 20.102zM3.75 7.199c0 1.275.975 2.25 2.25 2.25s2.25-.975 2.25-2.25c0-1.273-.975-2.25-2.25-2.25s-2.25.977-2.25 2.25z"/></svg>Switch</a></nav>
            </div>
            <div class="flex flex-col sm:flex-row w-full xl:w-auto gap-3">
                <select id="sortSelect" class="block w-full sm:w-auto sm:shrink-0 pl-4 pr-8 py-2 border border-white/10 rounded-xl bg-vr-dark text-gray-200 focus:outline-none focus:ring-2 focus:ring-vr-accent2 text-sm cursor-pointer">
                    <option value="rating">По рейтингу</option>
                    <option value="year">Сначала новые</option>
                    <option value="name">По алфавиту</option>
                </select>
                <input type="text" id="searchInput" placeholder="Найти игру..." class="block w-full sm:flex-1 xl:flex-none xl:w-72 px-4 py-2 border border-white/10 rounded-xl bg-vr-dark text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-vr-accent2 text-sm">
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <section class="mb-10 rounded-3xl bg-vr-card border border-white/10 p-6 sm:p-8 md:p-10 flex flex-col md:flex-row items-center justify-between gap-8">
            <div class="max-w-2xl text-center md:text-left">
                <h2 class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold mb-4 leading-tight">Лучшие игры <span class="text-vr-accent1">для ПК</span></h2>
                <p class="text-gray-300 text-lg mb-6 leading-relaxed">Каталог игр для Windows, Linux и SteamDeck: от инди-хитов до AAA. Выбери, во что играть дальше.</p>
                <button id="randomBtn" class="bg-vr-accent2 text-vr-dark hover:brightness-110 font-extrabold py-3 px-8 rounded-full transition shadow-lg">Случайная игра <i class="fa-solid fa-dice ml-2"></i></button>
            </div>
            <div class="hidden md:flex w-40 h-40 lg:w-56 lg:h-56 shrink-0 rounded-full bg-vr-dark items-center justify-center border border-white/10 shadow-inner">
                <i class="fa-solid fa-desktop text-6xl lg:text-8xl text-vr-accent1"></i>
            </div>
        </section>

        <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 mb-4" id="filterContainer"></div>
        <p id="count" class="text-gray-400 text-sm mb-6 text-center md:text-left">Загрузка игр...</p>
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="noResults" class="hidden text-center py-20">
            <i class="fa-solid fa-ghost text-6xl text-gray-500 mb-4"></i>
            <h3 class="text-2xl font-display text-gray-300">Игры не найдены</h3>
            <p class="text-gray-500 mt-2">Попробуйте изменить запрос или фильтры</p>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 z-[60] items-center justify-center p-4 bg-black/70 backdrop-blur-sm" role="dialog" aria-modal="true">
        <div class="bg-vr-card rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-white/10 relative shadow-2xl">
            <button id="modalClose" aria-label="Закрыть" class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-black/50 hover:bg-black/70 text-white flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="glass border-t border-white/10 py-6 mt-12 text-center text-gray-400 text-sm">
        © 2026 VR NEXUS. Источники данных: Steam, <a href="https://rawg.io" target="_blank" rel="noopener" class="underline hover:text-white">RAWG</a>.
    </footer>

    <script src="catalog.js"></script>
</body>
</html>
