name: Update games data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: .cache.json
          key: steam-cache-${{ github.run_id }}
          restore-keys: steam-cache-
      - run: python build_data.py --limit 0 --max-minutes 290 --rawg-pages 30
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
      - run: python build_other.py --max-minutes 60
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
      - name: Save
        run: |
          git config user.name "vrnexus-bot"
          git config user.email "bot@users.noreply.github.com"
          git add games.json pc.json switch.json ps5.json xbox.json
          git diff --cached --quiet || (git commit -m "Update games.json" && git push)
