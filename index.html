<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR NEXUS - Каталог VR Игр</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'], display: ['Nunito', 'sans-serif'] },
                    colors: { vr: { dark: '#232738', card: '#2e3350', accent1: '#9be3d3', accent2: '#c3b1f5' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex flex-col antialiased">

    <header class="glass sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-vr-cardboard text-3xl text-vr-accent1"></i>
                <h1 class="font-display text-2xl font-extrabold tracking-wide">VR<span class="text-vr-accent2">NEXUS</span></h1>
            </div>
            <div class="flex flex-col md:flex-row w-full md:w-auto gap-3">
                <select id="platformSelect" class="block w-full pl-4 pr-8 py-2 border border-white/10 rounded-xl bg-vr-dark text-gray-200 focus:outline-none focus:ring-2 focus:ring-vr-accent2 text-sm cursor-pointer">
                    <option value="all">Все платформы</option>
                    <option value="steam">SteamVR</option>
                    <option value="quest">Meta Quest</option>
                    <option value="psvr2">PS VR2</option>
                </select>
                <input type="text" id="searchInput" placeholder="Найти игру (например, Bonelab)..." class="block w-full md:w-80 px-4 py-2 border border-white/10 rounded-xl bg-vr-dark text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-vr-accent2 text-sm">
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <section class="mb-10 rounded-3xl bg-vr-card border border-white/10 p-8 md:p-10 flex flex-col md:flex-row items-center justify-between gap-8">
            <div class="max-w-2xl text-center md:text-left">
                <h2 class="font-display text-3xl md:text-5xl font-extrabold mb-4 leading-tight">Погрузись в <span class="text-vr-accent1">иную реальность</span></h2>
                <p class="text-gray-300 text-lg mb-6 leading-relaxed">Мультиплатформенный каталог VR-игр из нескольких источников. Выбери свой следующий мир.</p>
                <button id="randomBtn" class="bg-vr-accent2 text-vr-dark hover:brightness-110 font-extrabold py-3 px-8 rounded-full transition shadow-lg">Случайная игра <i class="fa-solid fa-dice ml-2"></i></button>
            </div>
            <div class="hidden md:flex w-56 h-56 shrink-0 rounded-full bg-vr-dark items-center justify-center border border-white/10 shadow-inner">
                <i class="fa-solid fa-vr-cardboard text-8xl text-vr-accent1"></i>
            </div>
        </section>

        <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 mb-4" id="filterContainer"></div>
        <p id="count" class="text-gray-400 text-sm mb-6 text-center md:text-left">Загрузка источников игр...</p>
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        
        <div id="noResults" class="hidden text-center py-20">
            <i class="fa-solid fa-ghost text-6xl text-gray-500 mb-4"></i>
            <h3 class="text-2xl font-display text-gray-300">Игры не найдены</h3>
            <p class="text-gray-500 mt-2">Попробуйте изменить запрос или фильтры</p>
        </div>
    </main>

    <!-- Модальное окно -->
    <div id="modal" class="hidden fixed inset-0 z-[60] items-center justify-center p-4 bg-black/70 backdrop-blur-sm" role="dialog" aria-modal="true">
        <div class="bg-vr-card rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-white/10 relative shadow-2xl">
            <button id="modalClose" aria-label="Закрыть" class="absolute top-3 right-3 z-10 w-10 h-10 rounded-full bg-black/50 hover:bg-black/70 text-white flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer class="glass border-t border-white/10 py-6 mt-12 text-center text-gray-400 text-sm">
        © 2026 VR NEXUS. Источники данных: Steam, <a href="https://rawg.io" target="_blank" rel="noopener" class="underline hover:text-white">RAWG</a>, Meta Store, PlayStation Store.
    </footer>

    <script src="app.js"></script>
</body>
</html>
